```html
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Punti</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN / SCELTA NICKNAME -->
    <div id="loginScreen" class="screen">
        <div class="login-box">
            <h1>Benvenuto</h1>
            <p>Inserisci il tuo nickname</p>

            <input
                type="text"
                id="nicknameInput"
                placeholder="Nickname"
                maxlength="20"
                autocomplete="off"
            >

            <button id="loginButton">ENTRA</button>

            <p id="loginError" class="error"></p>
        </div>
    </div>


    <!-- APP -->
    <div id="app" class="hidden">

        <!-- HOME -->
        <main id="homePage" class="page active">

            <div class="top">
                <span>Ciao,</span>
                <strong id="nicknameDisplay">---</strong>
            </div>

            <div class="score-container">

                <div class="score-label">
                    IL TUO PUNTEGGIO
                </div>

                <div id="scoreDisplay" class="score">
                    0
                </div>

                <div id="levelDisplay" class="level">
                    LIVELLO 1
                </div>

            </div>

            <button id="addButton" class="add-button">
                <span>＋</span>
                AGGIUNGI
            </button>

            <!-- Input fotocamera -->
            <input
                type="file"
                id="cameraInput"
                accept="image/*"
                capture="environment"
                hidden
            >

            <div id="statusMessage" class="status"></div>

        </main>


        <!-- CLASSIFICA -->
        <main id="rankingPage" class="page">

            <h1>Classifica</h1>

            <div id="rankingContainer"></div>

        </main>


        <!-- REPERTI -->
        <main id="galleryPage" class="page">

            <h1>I miei reperti</h1>

            <p class="private-text">
                Queste fotografie sono private e visibili solo a te.
            </p>

            <div id="gallery" class="gallery"></div>

        </main>


        <!-- NAVIGATION -->
        <nav class="bottom-nav">

            <button class="nav-button" data-page="rankingPage">
                <span>🏆</span>
                <small>Classifica</small>
            </button>

            <button class="nav-button home-button active" data-page="homePage">
                <span>⌂</span>
                <small>Home</small>
            </button>

            <button class="nav-button" data-page="galleryPage">
                <span>📷</span>
                <small>Reperti</small>
            </button>

        </nav>

    </div>


    <!-- MODALE FOTO -->
    <div id="photoModal" class="modal hidden">

        <div class="modal-box">

            <h2>Foto acquisita</h2>

            <img id="previewImage" src="" alt="Foto acquisita">

            <div id="verificationResult"></div>

            <button id="closeModal">
                CHIUDI
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
```
